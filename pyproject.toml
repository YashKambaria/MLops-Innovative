[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.1.0"
description = "Step 1: reproducible phishing URL classification pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "jinja2>=3.1,<4",
  "joblib>=1.3,<2",
  "pandas>=2.0,<3",
  "prometheus-client>=0.20,<1",
  "python-multipart>=0.0.9,<1",
  "scikit-learn>=1.3,<2",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=7.4,<9",
]

[project.scripts]
phishguard-api = "phishguard.api:main"
phishguard-train = "phishguard.pipeline:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishguard = ["templates/*.html"]
