services:
  phishguard:
    build: .
    image: phishguard:step2
    ports:
      - "8000:8000"
    environment:
      PHISHGUARD_MODEL_PATH: /app/artifacts/model.joblib
    volumes:
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
